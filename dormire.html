<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f2ea"><!-- barra di stato del telefono: colore della pagina -->
<title>Dormire — Marocco</title>
<link rel="stylesheet" href="stile.css">
<style>
  /* Elenco: testo a sinistra, foto a destra. */
  .stays { display: grid; gap: 14px; }
  .stay { display: flex; align-items: stretch; gap: 14px; max-width: 560px; padding: 12px; border: 1px solid var(--line); border-radius: 18px; background: color-mix(in srgb, var(--land) 35%, var(--bg)); }
  .stay-txt { display: flex; flex: 1; min-width: 0; flex-direction: column; justify-content: center; gap: 2px; line-height: 1.35; }
  .stay-txt b { font-size: 17px; }
  .stay-txt span { color: var(--muted); font-size: 14px; }
  .stay-txt .stay-price { margin-top: 6px; color: var(--ink); font-weight: 700; }
  .stay-photo { position: relative; flex: 0 0 42%; aspect-ratio: 1; overflow: hidden; border-radius: 12px; background: var(--line); }
  .stay-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .stay-go { position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--bg) 92%, transparent); color: var(--ink); cursor: pointer; }
  .stay-go:disabled { color: var(--muted); opacity: .75; cursor: not-allowed; }
  .credits { margin-top: 32px; color: var(--muted); font-size: 12px; }
  .credits summary { cursor: pointer; }
  .credits p { margin: 6px 0 0; }
  .credits a { color: inherit; }
</style>
</head>
<body data-page="dormire">
<main class="page" id="root"></main>
<script src="nav.js"></script>
<script>
const GO = 'm242-246-42-42 412-412H234v-60h480v480h-60v-378L242-246Z';
function stay(v) {
  const c = el('article', 'stay');
  c.innerHTML = `
    <div class="stay-txt"><b>${v.luogo}</b><span>${v.struttura}</span><span>${v.notti} · ${v.date}</span><span class="stay-price">${v.prezzo}</span></div>
    <div class="stay-photo"><img src="${v.foto}" alt="" loading="lazy"><button class="stay-go" type="button" aria-label="Maggiori dettagli" title="Non ancora disponibile" disabled>${iconaSvg(GO, 18)}</button></div>`;
  if (v.link) { const b = c.querySelector('.stay-go'); b.disabled = false; b.title = 'Maggiori dettagli'; b.onclick = () => open(v.link, '_blank', 'noopener'); }
  return c;
}
load('dormire').then(d => {
  if (d.mock) root.append(el('p', 'mock', 'Dati di esempio: da sostituire con quelli reali.'));
  const g = el('div', 'stays'); d.voci.forEach(v => g.append(stay(v))); root.append(g);
  const cr = el('details', 'credits'); cr.append(el('summary', '', 'Crediti foto'));
  d.voci.forEach(v => { const p = el('p'), a = el('a', '', `${v.autore} · ${v.licenza}`); a.href = v.fonte; a.target = '_blank'; a.rel = 'noopener'; p.append(`${v.luogo}: `, a); cr.append(p); });
  root.append(cr);
}).catch(() => root.append(el('p', 'intro', 'Dati non disponibili.')));
</script>
</body>
</html>
