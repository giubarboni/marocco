<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea"><!-- barra di stato del telefono: colore della pagina -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marocco">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><!-- come app sulla Home: la pagina va sotto la barra di stato -->
<title>Valigia — Marocco</title>
<link rel="stylesheet" href="stile.css">
<style>
  .list { margin: 0 0 14px; padding-left: 18px; font-size: 14px; }
  .list li { padding: 3px 0; }
  .trow { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 16px; }
  .trow .ptitle { margin: 0; }
  .ibtn { flex: none; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); cursor: pointer; }
  .ibtn.lbl { width: auto; gap: 6px; padding: 0 14px 0 10px; border-radius: 999px; grid-auto-flow: column; font: inherit; font-size: 14px; font-weight: 600; }
  .card { border: 0; }
  .ibtn:active { background: color-mix(in srgb, var(--ink) 16%, transparent); }
</style>
</head>
<body data-page="valigia">
<main class="page" id="root"></main>
<script src="nav.js"></script>
<script>
const COPIA = 'M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z', OK = 'M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z';
const ibtn = (label, t, conLabel) => {
  const b = el('button', conLabel ? 'ibtn lbl' : 'ibtn'), vista = ic => b.innerHTML = iconaSvg(ic, 20) + (conLabel ? label : '');
  b.type = 'button'; b.ariaLabel = label; vista(COPIA);
  b.onclick = async () => { await navigator.clipboard.writeText(t()); vista(OK); setTimeout(() => vista(COPIA), 1500); };
  return b;
};
const testo = s => `${s.nome.toUpperCase()}\n${s.voci.map(v => '- ' + v).join('\n')}`;
load('valigia').then(d => {
  const h = document.querySelector('.ptitle'), row = el('div', 'trow'), all = ibtn('Copia tutto', () => d.sezioni.map(testo).join('\n\n'), true);
  h.replaceWith(row); row.append(h, all);
  for (const s of d.sezioni) {
    const card = el('section', 'card'), head = el('div', 'chead');
    head.append(el('h2', '', s.nome), ibtn('Copia ' + s.nome, () => testo(s)));
    const ul = el('ul', 'list'); s.voci.forEach(v => ul.append(el('li', '', v)));
    card.append(head, ul); root.append(card);
  }
}).catch(() => root.append(el('p', 'intro', 'Dati non disponibili.')));
</script>
</body>
</html>
