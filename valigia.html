<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valigia — Marocco</title>
<link rel="stylesheet" href="stile.css">
<style>
  .list { margin: 0 0 14px; padding-left: 18px; font-size: 14px; }
  .list li { padding: 3px 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 16px; }
  .bar .intro { margin: 0; }
</style>
</head>
<body data-page="valigia">
<main class="page" id="root"></main>
<script src="nav.js"></script>
<script>
const root = document.getElementById('root');
const testo = s => `${s.nome.toUpperCase()}\n${s.voci.map(v => '- ' + v).join('\n')}`;
// Copia negli appunti (testo semplice, adatto alle note); in mancanza dell'API si ripiega su un campo di testo temporaneo.
async function copia(btn, t) {
  try { await navigator.clipboard.writeText(t); }
  catch { const a = el('textarea'); a.value = t; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); }
  const l = btn.textContent; btn.textContent = 'Copiato ✓'; setTimeout(() => btn.textContent = l, 1500);
}
load('valigia').then(d => {
  const bar = el('div', 'bar'), all = el('button', 'btn', 'Copia tutto'); all.type = 'button';
  all.onclick = () => copia(all, d.sezioni.map(testo).join('\n\n'));
  bar.append(el('p', 'intro', d.intro), all); root.append(bar);
  for (const s of d.sezioni) {
    const card = el('section', 'card'), head = el('div', 'chead'), b = el('button', 'btn', 'Copia'); b.type = 'button';
    b.onclick = () => copia(b, testo(s));
    head.append(el('h2', '', s.nome), b);
    const ul = el('ul', 'list'); s.voci.forEach(v => ul.append(el('li', '', v)));
    card.append(head, ul); root.append(card);
  }
}).catch(() => root.append(el('p', 'intro', 'Dati non disponibili.')));
</script>
</body>
</html>
