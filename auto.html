<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea"><!-- barra di stato del telefono: colore della pagina -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Marocco">

<title>Auto — Marocco</title>
<link rel="stylesheet" href="stile.css">
<style>
  /* Le due auto stanno affiancate; su mobile scorrono in orizzontale. */
  .cars { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .cars { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px 12px; scroll-padding: 0 16px; } .car { flex: 0 0 82%; scroll-snap-align: start; } }
  .car { display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; background: var(--card, color-mix(in srgb, var(--land) 57%, var(--bg))); }
  /* L'auto (PNG trasparente, con l'ombra già nell'immagine) sta sullo sfondo della card; l'altezza è uguale per le due card. */
  .car-img { position: relative; aspect-ratio: 2 / 1; }
  .car-photo { position: absolute; inset: 12px 12px 0; width: calc(100% - 24px); height: calc(100% - 12px); object-fit: contain; }
  .car-body { display: flex; flex: 1; flex-direction: column; gap: 14px; padding: 16px; }
  .car h2 { margin: 0; font-size: 20px; letter-spacing: .01em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--line); font-size: 13px; font-weight: 600; }
  .car ul { margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
  .car li { display: flex; align-items: center; gap: 8px; padding: 3px 0; border: 0; }
  .car li svg, .chip svg { flex: none; }
  .price { margin-top: auto; }
  .price b { font-size: 26px; }
  .price span { color: var(--muted); font-size: 14px; }
  .price small { display: block; color: var(--muted); font-size: 13px; }
  .credit { padding: 0 16px 12px; color: var(--muted); font-size: 11px; }
  .credit a { color: inherit; }
</style>
</head>
<body data-page="auto">
<main class="page" id="root"></main>
<script src="nav.js"></script>
<script>
const ICO = {

  ritiro: 'M529.5-510.5Q550-531 550-560t-20.5-49.5Q509-630 480-630t-49.5 20.5Q410-589 410-560t20.5 49.5Q451-490 480-490t49.5-20.5ZM480-159q133-121 196.5-219.5T740-552q0-118-75.5-193T480-820q-109 0-184.5 75T220-552q0 75 65 173.5T480-159Zm0 79Q319-217 239.5-334.5T160-552q0-150 96.5-239T480-880q127 0 223.5 89T800-552q0 100-79.5 217.5T480-80Zm0-480Z',

  cauzione: 'M540-420q-50 0-85-35t-35-85q0-50 35-85t85-35q50 0 85 35t35 85q0 50-35 85t-85 35ZM220-280q-24.75 0-42.37-17.63Q160-315.25 160-340v-400q0-24.75 17.63-42.38Q195.25-800 220-800h640q24.75 0 42.38 17.62Q920-764.75 920-740v400q0 24.75-17.62 42.37Q884.75-280 860-280H220Zm100-60h440q0-42 29-71t71-29v-200q-42 0-71-29t-29-71H320q0 42-29 71t-71 29v200q42 0 71 29t29 71Zm480 180H100q-24.75 0-42.37-17.63Q40-195.25 40-220v-460h60v460h700v60ZM220-340v-400 400Z'
};
const sv = (d, s = 16) => iconaSvg(d, s);
function auto(a) {
  const c = el('article', 'car');
  c.innerHTML = `
    <div class="car-img"><img class="car-photo" src="${a.foto}" alt=""></div>
    <div class="car-body">
      <div><h2>${a.modello}</h2></div>
      <div class="chips">
        <span class="chip">${sv(ICO.persone)}${a.persone}</span>
        <span class="chip">${sv(ICONE.valigia[0])}${a.bagagli}</span>
        <span class="chip">${a.cambio}</span>
        <span class="chip">${sv(ICO.clima)}${a.clima}</span>
      </div>
      <ul>${a.dettagli.map(([k, t]) => `<li>${sv(ICO[k])}<span>${t}</span></li>`).join('')}</ul>
      <div class="price"><b>${a.prezzoGiorno}</b> <span>/ giorno</span><small>Totale ${a.totale}</small></div>
      <div class="actions"></div>
    </div>
    <div class="credit">Foto: <a href="${a.fonte}" target="_blank" rel="noopener">${a.credito}</a></div>`;
  const act = c.querySelector('.actions');
  for (const [l, u] of a.bottoni) {
    const b = u ? el('a', 'btn', l) : el('button', 'btn', l);
    if (u) { b.href = u; b.target = '_blank'; b.rel = 'noopener'; } else { b.type = 'button'; b.disabled = true; b.title = 'Non ancora disponibile'; }
    act.append(b);
  }
  return c;
}
load('auto').then(d => {
  if (d.mock) root.append(el('p', 'mock', 'Dati di esempio: da sostituire con quelli reali.'));
  if (d.intro) root.append(el('p', 'intro', d.intro));
  const cars = el('div', 'cars'); d.auto.forEach(a => cars.append(auto(a))); root.append(cars);
}).catch(() => root.append(el('p', 'intro', 'Dati non disponibili.')));
</script>
</body>
</html>
