<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marocco — giro in auto</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1c1a17; --ink: #efe9df; --muted: #a49b8f; --line: #3a352f;
    --sea: #22303a; --land: #3a3427; --land-edge: #5a5040;
    --nat: #6fb27f; --city: #e58a5a; --coast: #6aaad4; --transit: #a39c90;
    --land-africa: color-mix(in srgb, var(--land) 65%, black); --route: #efe9df; --route-line: color-mix(in srgb, var(--route) 62%, var(--land)); --tag-bg: var(--route-line); --tag-ink: #3a3427;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: minmax(0, 900px) minmax(240px, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 10px; }
  .mapwrap { position: relative; }
  .legend { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-wrap: nowrap; justify-content: center; gap: 16px; padding: 6px 14px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 75%, transparent); color: var(--ink); font-size: 13px; white-space: nowrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  @media (max-width: 480px) { .legend { font-size: 11px; gap: 10px; padding: 5px 8px; bottom: 8px; } }
  .mapwrap svg { cursor: zoom-in; }
  .zbtn { position: absolute; top: 10px; left: 10px; border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; background: color-mix(in srgb, var(--bg) 75%, transparent); color: var(--ink); }
  .zoom { position: fixed; inset: 0; z-index: 10; overflow: clip; background: var(--sea); touch-action: none; cursor: grab; }
  .zoom[hidden] { display: none; }
  .zstage { position: absolute; left: 0; top: 0; width: 900px; height: 620px; transform-origin: 0 0; }
  .zstage svg { width: 900px; height: 620px; max-width: none; border: 0; border-radius: 0; cursor: grab; }
  .zclose { position: fixed; z-index: 2; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 40px; height: 40px; border: 0; border-radius: 50%; font-size: 24px; line-height: 1; cursor: pointer; background: color-mix(in srgb, var(--bg) 75%, transparent); color: var(--ink); }
  .zhint { position: fixed; z-index: 1; top: max(20px, env(safe-area-inset-top));  left: 16px; right: 64px; color: var(--muted); font-size: 12px; pointer-events: none; }
  .stop, [data-slug] { cursor: pointer; }
  ol li[data-slug]:hover .t { text-decoration: underline; }
  .modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .6); }
  .modal[hidden] { display: none; }
  .sheet { width: 100%; max-width: 560px; max-height: 88vh; max-height: 88dvh; overflow-y: auto; padding: 16px 16px 28px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 16px 16px 0 0; }
  @media (min-width: 700px) { .modal { align-items: center; } .sheet { border-radius: 16px; } }
  .mhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .sheet h2 { margin: 0; font-size: 20px; }
  .mmeta { color: var(--muted); font-size: 13px; }
  .mclose { flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%; font-size: 22px; line-height: 1; cursor: pointer; background: var(--line); color: var(--ink); }
  .mphotos { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; margin: 0 -16px 14px; padding: 0 16px 12px; scrollbar-width: thin; }
  .mphotos figure { flex: 0 0 82%; margin: 0; scroll-snap-align: start; }
  .mphotos img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; background: var(--line); }
  .mphotos figcaption { margin-top: 4px; font-size: 11px; line-height: 1.35; color: var(--muted); }
  .mphotos .mcap { color: var(--ink); font-size: 12px; }
  .mphotos a { color: inherit; }
  .mdesc { margin: 0 0 14px; font-size: 15px; }
  .mlabel { margin-bottom: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .mtodo { margin: 0; padding-left: 18px; font-size: 14px; }
  .mtodo li { display: list-item; padding: 3px 0; border: 0; font-size: 14px; cursor: default; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 18px 0; font-size: 12px; line-height: 1.35; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .n { width: 22px; height: 22px; border-radius: 50%; color: var(--land); font-weight: 700; display: grid; place-items: center; font-size: 11px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
  .t { font-weight: 600; }
  .meta { color: var(--muted); font-size: 11px; }
  .note { margin-top: 2px; }
  </style>
</head>
<body>
<main>
  <h1>Marocco in auto — 26 dic / 10 gen</h1>
  <div class="grid">
    <div class="mapwrap">
      <button class="zbtn" type="button">⤢ Ingrandisci</button>
      <svg id="map" viewBox="0 0 900 620" role="img" aria-label="Mappa dell'itinerario in Marocco"></svg>
      <div class="legend">
        <span><i style="background:var(--nat)"></i>Natura</span>
        <span><i style="background:var(--city)"></i>Città / cultura</span>
        <span><i style="background:var(--coast)"></i>Costa</span>
        <span><i style="background:var(--transit)"></i>Transito</span>
      </div>
    </div>
    <ol id="list"></ol>
  </div>
</main>

<script>
// Equirettangolare con longitudine scalata a 32°N: abbastanza per una mappa schematica.
// Zoom sul tragitto: scala 130 px/grado, origine spostata per centrare il giro (le etichette restano a dimensione fissa).
const X = lon => -28 + (lon + 11.2) * 0.85 * 130;
const Y = lat => -170 + (36 - lat) * 130;
const P = ([lat, lon]) => `${X(lon).toFixed(1)},${Y(lat).toFixed(1)}`;

// Contorno semplificato (lat, lon), in senso orario da Capo Spartel.
const outline = [
  [35.79,-5.92],[35.9,-5.35],[35.6,-4.6],[35.25,-3.93],[35.17,-2.93],[35.1,-2.2],
  [34.0,-1.75],[32.8,-1.5],[32.1,-1.2],[31.6,-2.2],[31.1,-3.4],[30.0,-5.3],
  [29.0,-7.0],[28.5,-8.7],[28.5,-11.0],[29.0,-10.5],[29.38,-10.18],[29.7,-9.85],
  [30.65,-9.85],[31.5,-9.8],[32.3,-9.3],[33.25,-8.55],[33.6,-7.7],[34.03,-6.85],[35.2,-6.2]
];

// Contorno grossolano dell'Africa (lat, lon), in senso orario da Capo Spartel. Il tratto marocchino coincide con `outline`.
const africa = [
  [35.79,-5.92],[35.9,-5.35],[35.6,-4.6],[35.25,-3.93],[35.17,-2.93],[35.1,-2.2],
  [35.7,-0.65],[36.1,0.5],[36.5,1.8],[36.77,3.06],[36.9,5.1],[37.0,6.9],[36.9,8.0],[37.25,9.85],[36.8,10.3],[37.05,11.0],
  [35.8,10.8],[34.7,10.8],[33.9,10.1],[33.1,11.5],[32.9,13.2],[32.4,15.1],[31.2,16.6],[30.3,19.0],[31.8,20.0],[32.8,22.0],
  [32.1,23.9],[31.6,25.1],[31.3,27.2],[31.2,29.9],[31.3,31.4],[31.25,32.3],[29.9,32.6],[28.0,33.5],[24.1,35.5],[22.0,36.9],
  [19.6,37.2],[15.6,39.5],[12.6,43.3],[11.6,43.1],[11.8,51.3],[8.0,49.8],[2.0,45.3],[-1.7,41.5],[-4.0,39.7],[-6.8,39.3],
  [-10.3,40.2],[-15.0,40.7],[-19.8,34.9],[-24.0,35.5],[-25.9,32.6],[-29.9,31.0],[-33.0,27.9],[-34.0,25.7],[-34.8,20.0],
  [-33.9,18.4],[-28.6,16.5],[-26.6,15.2],[-22.9,14.5],[-18.0,11.8],[-12.4,13.7],[-8.8,13.2],[-5.9,12.2],[-0.7,8.8],[0.4,9.4],
  [3.8,9.7],[4.3,7.0],[6.4,3.4],[5.6,-0.2],[5.2,-4.0],[4.4,-7.6],[6.3,-10.8],[8.5,-13.2],[10.0,-14.4],[11.9,-15.6],
  [14.7,-17.5],[16.0,-16.5],[18.1,-16.0],[20.9,-17.05],[23.7,-15.95],[27.1,-13.2],[27.9,-12.9],[28.5,-11.0],[29.0,-10.5],
  [29.38,-10.18],[29.7,-9.85],[30.65,-9.85],[31.5,-9.8],[32.3,-9.3],[33.25,-8.55],[33.6,-7.7],[34.03,-6.85],[35.2,-6.2]
];
const madagascar = [[-12.0,49.3],[-16.0,50.4],[-22.0,47.9],[-25.5,45.2],[-24.0,43.7],[-17.0,44.0],[-15.5,46.3]];

// n = numero tappa, tipo: nat | city | coast | transit
const stops = [
  {n:1, slug:'marrakech',  name:'Marrakech',           ll:[31.63,-8.0],   type:'city',    nights:2, drive:'',      note:'Medina, Jemaa el-Fnaa, souk. Ritiro delle auto.', lab:[0,32,'middle']},
  {n:2, slug:'ouzoud',  name:'Cascate di Ouzoud',   ll:[32.02,-6.72],  type:'nat',     nights:1, drive:'~3 h',  note:'Cascate di 110 m, sentieri e barchette.',        lab:[-18,-2,'end']},
  {n:3, slug:'fes',  name:'Fès',                 ll:[34.03,-5.0],   type:'city',    nights:2, drive:'~5,5 h',note:'Medina medievale. Sosta ai cedri di Azrou.', lab:[-18,-2,'end']},
  {n:4, slug:'midelt',  name:'Midelt',              ll:[32.68,-4.74],  type:'transit', nights:1, drive:'~3 h',  note:'Solo tappa. Notte fredda, serve riscaldamento.', lab:[18,-2,'start']},
  {n:5, slug:'merzouga',  name:'Merzouga',            ll:[31.10,-4.01],  type:'nat',     nights:2, drive:'~4,5 h',note:'Dune dell’Erg Chebbi, notte in campo tendato.',  lab:[18,-2,'start']},
  {n:6, slug:'todra-dades',  name:'Gole del Todra / Dadès',ll:[31.45,-5.75],type:'nat',     nights:2, drive:'~3 h',  note:'Pareti di 300 m, oasi, strada a tornanti.',      lab:[0,-32,'middle']},
  {n:7, slug:'ait-benhaddou',  name:'Aït Benhaddou',       ll:[31.05,-7.13],  type:'city',    nights:1, drive:'~3,5 h',note:'Ksar UNESCO di fango, set di molti film.',       lab:[0,30,'middle']},
  {n:8, slug:'essaouira',  name:'Essaouira',           ll:[31.51,-9.77],  type:'coast',   nights:2, drive:'~7 h',  note:'Via Tizi n’Tichka e Marrakech. Costa e pesce.', lab:[-18,-2,'end']},
  {n:9, slug:'marrakech',  name:'Marrakech (rientro)', ll:[31.63,-8.0],   type:'city',    nights:1, drive:'~3 h',  note:'Cuscinetto prima del volo.',                      lab:null}
];

// Punto di passaggio non numerato.
const via = { tizi:[31.3,-7.36] };
const at = n => stops.find(s => s.n === n).ll;
const nightsLabel = s => s.n === 1 ? `${s.nights} + ${stops.find(t => t.n === 9).nights} notti` : `${s.nights} ${s.nights === 1 ? 'notte' : 'notti'}`;

// [da, a, curvatura, ore, dx, dy, ancora] — ore = etichetta sul tratto (dx/dy spostano il testo).
const segs = [
  [at(1), at(2), 0, '3 h'], [at(2), at(3), 0, '5,5 h'], [at(3), at(4), 0, '3 h'],
  [at(4), at(5), 0, '4,5 h'], [at(5), at(6), 0, '3 h'], [at(6), at(7), 0, '3,5 h'],
  [at(7), via.tizi, 0, '', 0, 0, 'middle', true], [via.tizi, at(1), 0, '4 h', 14, 16, 'start'],
  [at(1), at(8), 0, '3 h', 0, -8], [at(8), at(1), 22, '3 h', 0, 14]
];

const color = t => `var(--${t === 'transit' ? 'transit' : t})`;
const svg = document.getElementById('map');
let out = `<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M0,1 L9,5 L0,9 z" fill="var(--route-line)"/></marker></defs>
  <rect x="-3000" y="-3000" width="7000" height="7000" fill="var(--sea)"/>
  <g fill="var(--land-africa)" stroke="var(--land-edge)" stroke-width="1.5" vector-effect="non-scaling-stroke">${[africa, madagascar].map(a => `<polygon points="${a.map(P).join(' ')}" vector-effect="non-scaling-stroke"/>`).join('')}</g>
  <polygon points="${outline.map(P).join(' ')}" fill="var(--land)" stroke="var(--land-edge)" stroke-width="1.5"/>
  <g fill="var(--muted)" font-size="13" font-style="italic" opacity=".8">
    <text x="24" y="250">Oceano Atlantico</text>
    <text x="815" y="560" text-anchor="middle">Algeria</text>
  </g>`;

// Grandi città fuori dal giro: solo riferimento per orientarsi, volutamente discrete.
const refCities = [
  { name: 'Tangeri',    ll: [35.78, -5.80], dx: 7,  anchor: 'start' },
  { name: 'Oujda',      ll: [34.68, -1.90], dx: -7, anchor: 'end' },
  { name: 'Rabat',      ll: [34.02, -6.84], dx: -7, anchor: 'end' },
  { name: 'Casablanca', ll: [33.57, -7.59], dx: -7, anchor: 'end' },
  { name: 'Agadir',     ll: [30.43, -9.60], dx: -7, anchor: 'end' }
];
out += `<g fill="var(--muted)" opacity=".55" font-size="10">${refCities.map(c =>
  `<circle cx="${X(c.ll[1])}" cy="${Y(c.ll[0])}" r="2.5"/><text x="${X(c.ll[1]) + c.dx}" y="${Y(c.ll[0]) + 3.5}" text-anchor="${c.anchor}">${c.name}</text>`).join('')}</g>`;

const labels = [];
for (const [a, b, bend, h, ox = 0, oy = 4, anchor = 'middle', noArrow] of segs) {
  const [x1, y1] = [X(a[1]), Y(a[0])], [x2, y2] = [X(b[1]), Y(b[0])];
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const cx = mx - dy / len * bend, cy = my + dx / len * bend;
  out += `<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="var(--route-line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 9" ${noArrow ? '' : 'marker-end="url(#a)"'}/>`;
  // punto a metà della curva (t = 0,5)
  if (h) labels.push(`<text x="${(x1 + 2 * cx + x2) / 4 + ox}" y="${(y1 + 2 * cy + y2) / 4 + oy}" text-anchor="${anchor}" class="hl" font-size="10" font-weight="600" fill="var(--tag-ink)">${h}</text>`);
}
out += labels.join('');

for (const s of stops) {
  if (s.n === 9) continue; // stesso punto della tappa 1
  const x = X(s.ll[1]), y = Y(s.ll[0]);
  const num = s.n === 1 ? '1·9' : s.n;
  const nts = nightsLabel(s);
  out += `<g class="stop" data-slug="${s.slug}"><circle cx="${x}" cy="${y}" r="${s.n === 1 ? 15 : 12}" fill="${color(s.type)}" stroke="var(--land)" stroke-width="2"/>
    <text x="${x}" y="${y + 4}" text-anchor="middle" font-size="${s.n === 1 ? 10 : 12}" font-weight="700" fill="var(--land)">${num}</text>
    <text x="${x + s.lab[0]}" y="${y + s.lab[1]}" text-anchor="${s.lab[2]}" font-size="13" font-weight="600" fill="var(--ink)"
      stroke="var(--land)" stroke-width="3" paint-order="stroke">${s.name}</text>
    <text x="${x + s.lab[0]}" y="${y + s.lab[1] + 13}" text-anchor="${s.lab[2]}" font-size="10" fill="var(--muted)"
      stroke="var(--land)" stroke-width="3" paint-order="stroke">${nts}</text></g>`;
}
svg.innerHTML = out;
// sfondo a pillola dietro ogni valore delle ore, misurato sul testo
svg.querySelectorAll('text.hl').forEach(t => {
  const b = t.getBBox();
  const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  r.setAttribute('x', b.x - 4); r.setAttribute('y', b.y - 1);
  r.setAttribute('width', b.width + 8); r.setAttribute('height', b.height + 2);
  r.setAttribute('rx', 6); r.setAttribute('fill', 'var(--tag-bg)');
  t.before(r);
});

// Lista tappe
document.getElementById('list').innerHTML = stops.map(s => `
  <li data-slug="${s.slug}"><span class="n" style="background:${color(s.type)}">${s.n}</span>
  <div><div class="head"><span class="t">${s.name}</span>
  <span class="meta">${s.nights} ${s.nights === 1 ? 'notte' : 'notti'}${s.drive ? ' · guida ' + s.drive : ''}</span></div>
  <div class="note">${s.note}</div></div></li>`).join('');

// Mappa a schermo intero: un dito sposta, due dita zoomano (rotellina su desktop).
// Nello schermo intero si disegna un'area enorme (tutta l'Africa): pizzicando indietro si vede il contesto; la mappa nella pagina resta il ritaglio sul tragitto.
const VB = [-860, -440, 7860, 9600];
const W = VB[2], H = VB[3];
const zoom = document.createElement('div');
zoom.className = 'zoom'; zoom.hidden = true;
zoom.innerHTML = '<div class="zstage"></div><button class="zclose" type="button" aria-label="Chiudi">×</button><div class="zhint">Pizzica per zoomare · trascina per spostare</div>';
zoom.append(document.querySelector('.legend').cloneNode(true));
document.body.append(zoom);
const stage = zoom.querySelector('.zstage');
let sc = 1, tx = 0, ty = 0, minSc = 1;

const apply = () => {
  const vw = zoom.clientWidth, vh = zoom.clientHeight, w = W * sc, h = H * sc;
  tx = w <= vw ? (vw - w) / 2 : Math.min(0, Math.max(vw - w, tx));
  ty = h <= vh ? (vh - h) / 2 : Math.min(0, Math.max(vh - h, ty));
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
};
const zoomAt = (f, cx, cy) => {
  const n = Math.min(4, Math.max(minSc, sc * f));
  tx = cx - (cx - tx) * (n / sc); ty = cy - (cy - ty) * (n / sc); sc = n; apply();
};
function openZoom() {
  const clone = svg.cloneNode(true); clone.removeAttribute('id');
  clone.setAttribute('viewBox', VB.join(' ')); clone.style.width = W + 'px'; clone.style.height = H + 'px';
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  stage.replaceChildren(clone);
  zoom.hidden = false; syncLock();
  minSc = Math.min(zoom.clientWidth / W, zoom.clientHeight / H);
  sc = Math.max(minSc, 1);  // parte a grandezza naturale (etichette leggibili), non più piccola dell'intera mappa
  // parte centrata sul ritaglio del tragitto (centro 450,310 nel disegno)
  tx = zoom.clientWidth / 2 - (450 - VB[0]) * sc; ty = zoom.clientHeight / 2 - (310 - VB[1]) * sc; apply();
}
const closeZoom = () => { zoom.hidden = true; syncLock(); };
svg.addEventListener('click', e => { const g = e.target.closest('[data-slug]'); g ? openTappa(g.dataset.slug) : openZoom(); });
document.getElementById('list').addEventListener('click', e => { const li = e.target.closest('[data-slug]'); if (li) openTappa(li.dataset.slug); });
document.querySelector('.zbtn').addEventListener('click', openZoom);
zoom.querySelector('.zclose').addEventListener('click', closeZoom);
addEventListener('keydown', e => { if (e.key === 'Escape') (modal.hidden ? closeZoom() : closeTappa()); });
addEventListener('resize', () => { if (!zoom.hidden) { minSc = Math.min(zoom.clientWidth / W, zoom.clientHeight / H); sc = Math.max(sc, minSc); apply(); } });

const ptrs = new Map();
let tap = null;
zoom.addEventListener('pointerdown', e => {
  if (e.target.closest('.zclose')) return;
  tap = ptrs.size ? null : { x: e.clientX, y: e.clientY, moved: false };
  zoom.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  zoom.querySelector('.zhint').hidden = true;
});
zoom.addEventListener('pointermove', e => {
  const prev = ptrs.get(e.pointerId); if (!prev) return;
  const cur = { x: e.clientX, y: e.clientY };
  if (tap && Math.hypot(cur.x - tap.x, cur.y - tap.y) > 8) tap.moved = true;
  if (ptrs.size === 1) { tx += cur.x - prev.x; ty += cur.y - prev.y; apply(); }
  else if (ptrs.size === 2) {
    const o = [...ptrs].find(([id]) => id !== e.pointerId)[1];
    const d0 = Math.hypot(prev.x - o.x, prev.y - o.y), d1 = Math.hypot(cur.x - o.x, cur.y - o.y);
    const mx = (cur.x + o.x) / 2, my = (cur.y + o.y) / 2;
    tx += mx - (prev.x + o.x) / 2; ty += my - (prev.y + o.y) / 2;
    d0 ? zoomAt(d1 / d0, mx, my) : apply();
  }
  ptrs.set(e.pointerId, cur);
});
zoom.addEventListener('pointerup', e => {
  if (tap && !tap.moved && ptrs.size === 1) {
    const g = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-slug]');
    if (g) openTappa(g.dataset.slug);
  }
  tap = null; ptrs.delete(e.pointerId);
});
zoom.addEventListener('pointercancel', e => { tap = null; ptrs.delete(e.pointerId); });
zoom.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.002), e.clientX, e.clientY); }, { passive: false });

// Scheda della tappa: legge tappe.md (fonte dei contenuti) alla prima apertura.
const modal = document.createElement('div');
modal.className = 'modal'; modal.hidden = true;
modal.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"></div>';
document.body.append(modal);
const sheet = modal.firstChild;
const syncLock = () => { document.body.style.overflow = (modal.hidden && zoom.hidden) ? '' : 'hidden'; };
const closeTappa = () => { modal.hidden = true; syncLock(); };
modal.addEventListener('click', e => { if (e.target === modal) closeTappa(); });

let tappe;
const loadTappe = () => tappe ||= fetch('tappe.md').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(t => {
  const out = {};
  for (const b of t.split(/^## /m).slice(1)) {
    const [head, ...rest] = b.split('\n'), body = rest.join('\n');
    const [slug, nome] = head.split(' — ');
    const sec = n => (body.split(new RegExp(`^### ${n}\\s*$`, 'm'))[1] || '').split(/^### /m)[0];
    const items = x => x.split('\n').filter(l => l.startsWith('- ')).map(l => l.slice(2).trim());
    out[slug.trim()] = {
      nome: nome.trim(), desc: body.split(/^### /m)[0].trim(), todo: items(sec('Da fare')),
      foto: items(sec('Foto')).map(l => { const [src, cap, cred, url] = l.split(' | '); return { src, cap, cred, url }; })
    };
  }
  return out;
});

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

async function openTappa(slug) {
  const st = stops.find(s => s.slug === slug);
  sheet.replaceChildren();
  const head = el('div', 'mhead'), titles = el('div');
  titles.append(el('h2', '', st.name), el('div', 'mmeta', nightsLabel(st)));
  const x = el('button', 'mclose', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Chiudi'); x.onclick = closeTappa;
  head.append(titles, x); sheet.append(head);
  modal.hidden = false; syncLock(); sheet.scrollTop = 0;
  let d;
  try { d = (await loadTappe())[slug]; if (!d) throw new Error('assente'); }
  catch { sheet.append(el('p', 'mdesc', 'Contenuti non disponibili: aprire la pagina online (in locale il file tappe.md non si può leggere).')); return; }

  if (d.foto.length) {
    const strip = el('div', 'mphotos');
    for (const f of d.foto) {
      const fig = el('figure'), img = new Image();
      img.src = f.src; img.alt = f.cap; img.loading = 'lazy';
      const cap = el('figcaption'); cap.append(el('span', 'mcap', f.cap), document.createElement('br'));
      if (/^https:/.test(f.url || '')) { const a = el('a', '', f.cred); a.href = f.url; a.target = '_blank'; a.rel = 'noopener'; cap.append(a); }
      else cap.append(f.cred || '');
      fig.append(img, cap); strip.append(fig);
    }
    sheet.append(strip);
  }
  sheet.append(el('p', 'mdesc', d.desc));
  if (d.todo.length) {
    sheet.append(el('div', 'mlabel', 'Da fare'));
    const ul = el('ul', 'mtodo'); d.todo.forEach(t => ul.append(el('li', '', t))); sheet.append(ul);
  }
}
</script>
</body>
