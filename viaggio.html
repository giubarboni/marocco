<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marocco — giro in auto</title>
<style>
  :root {
    --bg: #faf7f2; --ink: #2a2622; --muted: #7a7168; --line: #ddd5c8;
    --sea: #dfeaf0; --land: #f1e9d9; --land-edge: #cdbfa5;
    --nat: #3f7d4e; --city: #c5612f; --coast: #2f6f9a; --transit: #8a8378;
    --route: #2a2622; --tag-bg: #6b5640; --tag-ink: #faf7f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17; --ink: #efe9df; --muted: #a49b8f; --line: #3a352f;
      --sea: #22303a; --land: #3a3427; --land-edge: #5a5040;
      --nat: #6fb27f; --city: #e58a5a; --coast: #6aaad4; --transit: #a39c90;
      --route: #efe9df; --tag-bg: #8a6f52; --tag-ink: #1c1a17;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: minmax(0, 900px) minmax(240px, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 10px; }
  .mapwrap { position: relative; }
  .legend { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; padding: 6px 14px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 75%, transparent); color: var(--ink); font-size: 13px; white-space: nowrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 18px 0; font-size: 12px; line-height: 1.35; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .n { width: 22px; height: 22px; border-radius: 50%; color: var(--bg); font-weight: 700; display: grid; place-items: center; font-size: 11px; }
  .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
  .t { font-weight: 600; }
  .meta { color: var(--muted); font-size: 11px; }
  .note { margin-top: 2px; }
  </style>
</head>
<body>
<main>
  <h1>Marocco in auto — 26 dic / 10 gen</h1>
  <div class="grid">
    <div class="mapwrap">
      <svg id="map" viewBox="0 0 900 800" role="img" aria-label="Mappa dell'itinerario in Marocco"></svg>
      <div class="legend">
        <span><i style="background:var(--nat)"></i>Natura</span>
        <span><i style="background:var(--city)"></i>Città / cultura</span>
        <span><i style="background:var(--coast)"></i>Costa</span>
        <span><i style="background:var(--transit)"></i>Transito</span>
      </div>
    </div>
    <ol id="list"></ol>
  </div>
</main>

<script>
// Equirettangolare con longitudine scalata a 32°N: abbastanza per una mappa schematica.
const X = lon => 40 + (lon + 11.2) * 0.85 * 95;
const Y = lat => 40 + (36 - lat) * 95;
const P = ([lat, lon]) => `${X(lon).toFixed(1)},${Y(lat).toFixed(1)}`;

// Contorno semplificato (lat, lon), in senso orario da Capo Spartel.
const outline = [
  [35.79,-5.92],[35.9,-5.35],[35.6,-4.6],[35.25,-3.93],[35.17,-2.93],[35.1,-2.2],
  [34.0,-1.75],[32.8,-1.5],[32.1,-1.2],[31.6,-2.2],[31.1,-3.4],[30.0,-5.3],
  [29.0,-7.0],[28.5,-8.7],[28.5,-11.0],[29.0,-10.5],[29.38,-10.18],[29.7,-9.85],
  [30.65,-9.85],[31.5,-9.8],[32.3,-9.3],[33.25,-8.55],[33.6,-7.7],[34.03,-6.85],[35.2,-6.2]
];

// n = numero tappa, tipo: nat | city | coast | transit
const stops = [
  {n:1,  name:'Marrakech',           ll:[31.63,-8.0],   type:'city',    nights:2, drive:'',      note:'Medina, Jemaa el-Fnaa, souk. Ritiro del minibus.', lab:[0,28,'middle']},
  {n:2,  name:'Cascate di Ouzoud',   ll:[32.02,-6.72],  type:'nat',     nights:1, drive:'~3 h',  note:'Cascate di 110 m, sentieri e barchette.',        lab:[-12,-8,'end']},
  {n:3,  name:'Fès',                 ll:[34.03,-5.0],   type:'city',    nights:2, drive:'~5,5 h',note:'Medina medievale. Sosta ai cedri di Azrou.', lab:[-12,4,'end']},
  {n:4,  name:'Midelt',              ll:[32.68,-4.74],  type:'transit', nights:1, drive:'~3 h',  note:'Solo tappa. Notte fredda, serve riscaldamento.', lab:[12,4,'start']},
  {n:5,  name:'Merzouga',            ll:[31.10,-4.01],  type:'nat',     nights:2, drive:'~4,5 h',note:'Dune dell’Erg Chebbi, notte in campo tendato.',  lab:[12,4,'start']},
  {n:6,  name:'Gole del Todra / Dadès',ll:[31.45,-5.75],type:'nat',     nights:2, drive:'~3 h',  note:'Pareti di 300 m, oasi, strada a tornanti.',      lab:[0,-14,'middle']},
  {n:7,  name:'Aït Benhaddou',       ll:[31.05,-7.13],  type:'city',    nights:1, drive:'~3,5 h',note:'Ksar UNESCO di fango, set di molti film.',       lab:[0,26,'middle']},
  {n:8,  name:'Essaouira',           ll:[31.51,-9.77],  type:'coast',   nights:2, drive:'~7 h',  note:'Via Tizi n’Tichka e Marrakech. Costa e pesce.', lab:[-12,4,'end']},
  {n:9,  name:'Marrakech (rientro)', ll:[31.63,-8.0],   type:'city',    nights:1, drive:'~3 h',  note:'Cuscinetto prima del volo.',                      lab:null}
];

// Punto di passaggio non numerato.
const via = { tizi:[31.3,-7.36] };
const at = n => stops.find(s => s.n === n).ll;

// [da, a, curvatura, ore, dx, dy, ancora] — ore = etichetta sul tratto (dx/dy spostano il testo).
const segs = [
  [at(1), at(2), 0, '3 h'], [at(2), at(3), 0, '5,5 h'], [at(3), at(4), 0, '3 h'],
  [at(4), at(5), 0, '4,5 h'], [at(5), at(6), 0, '3 h'], [at(6), at(7), 0, '3,5 h'],
  [at(7), via.tizi, 0], [via.tizi, at(1), 0, '4 h', 14, 16, 'start'],
  [at(1), at(8), 0, '3 h', 0, -8], [at(8), at(1), 22, '3 h', 0, 14]
];

const color = t => `var(--${t === 'transit' ? 'transit' : t})`;
const svg = document.getElementById('map');
let out = `<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M0,1 L9,5 L0,9 z" fill="var(--route)"/></marker></defs>
  <rect width="900" height="800" fill="var(--sea)"/>
  <polygon points="${outline.map(P).join(' ')}" fill="var(--land)" stroke="var(--land-edge)" stroke-width="1.5"/>
  <g fill="var(--muted)" font-size="13" font-style="italic" opacity=".8">
    <text x="${X(-10.6)}" y="${Y(33.2)}" text-anchor="middle">Oceano Atlantico</text>
    <text x="${X(-3.7)}" y="${Y(35.75)}" text-anchor="middle">Mar Mediterraneo</text>
    <text x="${X(-2.2)}" y="${Y(32.3)}" text-anchor="middle">Algeria</text>
    <text x="${X(-6.3)}" y="${Y(29.3)}" text-anchor="middle">Sahara</text>
  </g>`;

const labels = [];
for (const [a, b, bend, h, ox = 0, oy = 4, anchor = 'middle'] of segs) {
  const [x1, y1] = [X(a[1]), Y(a[0])], [x2, y2] = [X(b[1]), Y(b[0])];
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const cx = mx - dy / len * bend, cy = my + dx / len * bend;
  out += `<path d="M${x1},${y1} Q${cx},${cy} ${x2},${y2}" fill="none" stroke="var(--route)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)" opacity=".75"/>`;
  // punto a metà della curva (t = 0,5)
  if (h) labels.push(`<text x="${(x1 + 2 * cx + x2) / 4 + ox}" y="${(y1 + 2 * cy + y2) / 4 + oy}" text-anchor="${anchor}" class="hl" font-size="10" font-weight="600" fill="var(--tag-ink)">${h}</text>`);
}
out += labels.join('');

for (const s of stops) {
  if (s.n === 9) continue; // stesso punto della tappa 1
  const x = X(s.ll[1]), y = Y(s.ll[0]);
  const num = s.n === 1 ? '1·9' : s.n;
  out += `<g><circle cx="${x}" cy="${y}" r="${s.n === 1 ? 15 : 12}" fill="${color(s.type)}" stroke="var(--bg)" stroke-width="2"/>
    <text x="${x}" y="${y + 4}" text-anchor="middle" font-size="${s.n === 1 ? 10 : 12}" font-weight="700" fill="var(--bg)">${num}</text>
    <text x="${x + s.lab[0]}" y="${y + s.lab[1]}" text-anchor="${s.lab[2]}" font-size="13" font-weight="600" fill="var(--ink)"
      stroke="var(--land)" stroke-width="3" paint-order="stroke">${s.name}</text></g>`;
}
svg.innerHTML = out;
// sfondo a pillola dietro ogni valore delle ore, misurato sul testo
svg.querySelectorAll('text.hl').forEach(t => {
  const b = t.getBBox();
  const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  r.setAttribute('x', b.x - 4); r.setAttribute('y', b.y - 1);
  r.setAttribute('width', b.width + 8); r.setAttribute('height', b.height + 2);
  r.setAttribute('rx', 6); r.setAttribute('fill', 'var(--tag-bg)');
  t.before(r);
});

// Lista tappe
document.getElementById('list').innerHTML = stops.map(s => `
  <li><span class="n" style="background:${color(s.type)}">${s.n}</span>
  <div><div class="head"><span class="t">${s.name}</span>
  <span class="meta">${s.nights} ${s.nights === 1 ? 'notte' : 'notti'}${s.drive ? ' · guida ' + s.drive : ''}</span></div>
  <div class="note">${s.note}</div></div></li>`).join('');
</script>
</body>
</html>
